name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish to npm Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Verification
        run: npm test

      - name: Publish to npm Registry
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current package version: $CURRENT_VERSION"
          
          # Check if this version already exists on npm registry
          EXISTS=$(npm view "antigravity-ui@$CURRENT_VERSION" version 2>/dev/null || echo "")
          if [ -n "$EXISTS" ]; then
            echo "Notice: Version $CURRENT_VERSION is already published on npm registry. Skipping publish step safely."
            exit 0
          fi
          
          echo "Publishing version $CURRENT_VERSION to npm..."
          npm publish --provenance --access public || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
